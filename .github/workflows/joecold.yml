name: Create New Billions Agent + Verify

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'joecold'
        required: true
        default: 'joecold'

jobs:
  create-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Billions CLI
        run: npm install -g @billions-network/cli

      - name: Step 1 - Register Identity
        run:  |
          echo "Registering identity for: ${{ github.event.inputs.agent_name }}"
          billions register ${{ github.event.inputs.agent_name }}

      - name: Step 2 - Create Ethereum Identity + Wallet 0x
        run:  |
          rm -rf ~/.billions
          billions identity create --name ${{ github.event.inputs.agent_name }}
          billions wallet export --name ${{ github.event.inputs.agent_name }} > wallet.txt
          echo "=== WALLET CREATED ===" 
          cat wallet.txt

      - name: Step 3 - Link Human to Agent
        run:  |
          echo "Linking human to agent: ${{ github.event.inputs.agent_name }}"
          billions link ${{ github.event.inputs.agent_name }}
          billions verify ${{ github.event.inputs.agent_name }}

      - name: Upload Wallet Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-wallet-${{ github.event.inputs.agent_name }}
          path: wallet.txt
          retention-days: 90
