name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'joecold'
        required: true
        default: 'joecold'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity --force

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Step 2 - Create Ethereum Identity + Wallet 0x
        run:  |
          rm -rf ~/.openclaw/billions/kms.json
          node scripts/createNewEthereumIdentity.js

          echo "=== DEBUG: Isi kms.json ==="
          cat ~/.openclaw/billions/kms.json
          echo "=========================="

          echo "Address: $(cat ~/.openclaw/billions/kms.json | jq -r '.keys[0].address //.address // empty')" > wallet.txt
          echo "Private Key: $(cat ~/.openclaw/billions/kms.json | jq -r '.keys[0].privateKey //.privateKey // empty')" >> wallet.txt

          echo "=== HASIL wallet.txt ==="
          cat wallet.txt
          echo "========================"

      - name: Save Wallet as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-wallet-${{ github.event.inputs.agent_name }}
          path: wallet.txt
          retention-days: 90

      - name: Step 3 - Link Human to Agent
        run:  |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_name }} AI Agent"}'
