name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify-human-identity:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Billions Scripts
        run: |
          git clone https://github.com/billions-org/verified-agent-identity.git billions
          cd billions

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: billions/package-lock.json

      - name: Install dependencies
        working-directory: ./billions
        run: npm install

      - name: Step 1 - Register Identity
        working-directory: ./billions
        run:  |
          echo "Registering identity for: joecold"
          node scripts/registerNewIdentity.js joecold

      - name: Step 2 - Create Ethereum Identity + Wallet 0x
        working-directory: ./billions
        run:  |
          rm -rf ~/.openclaw/billions/kms.json
          node scripts/createNewEthereumIdentity.js
          echo "Address: $(cat ~/.openclaw/billions/kms.json | jq -r '.keys[0].address')" > wallet.txt
          echo "Private Key: $(cat ~/.openclaw/billions/kms.json | jq -r '.keys[0].privateKey')" >> wallet.txt

      - name: Step 3 - Link Human to Agent
        working-directory: ./billions
        run:  |
          node scripts/manualLinkHumanToAgent.js joecold

      - name: Upload Wallet Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-wallet-joecold
          path: billions/wallet.txt
          retention-days: 90
